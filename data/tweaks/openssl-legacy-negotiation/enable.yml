---
# ansible playbook to apply OpenSSL legacy negotiation settings

- name: Apply OpenSSL Legacy Negotiation Settings
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
      - name: Ensure OpenSSL drop-in directory exists
        ansible.builtin.file:
            path: /etc/pki/tls/openssl.d
            state: directory
            owner: root
            group: root
            mode: "0755"

      - name: Apply legacy negotiation settings
        ansible.builtin.copy:
            dest: /etc/pki/tls/openssl.d/legacy-negotiation.cnf
            mode: "0644"
            content: |
                # This file is managed by Ultramarine Tweaks, manual changes will be overwritten.
                # To disable this configuration, run `um tweaks disable openssl-legacy-negotiation`.
                # see https://wiki.ultramarine-linux.org/en/usage/umcli/ for more information.
                [openssl_init]
                providers = provider_sect
                ssl_conf = ssl_sect

                [ssl_sect]
                system_default = system_default_sect

                [system_default_sect]
                Options = UnsafeLegacyRenegotiation
                CipherString = DEFAULT@SECLEVEL=1
        notify: Restart wpa_supplicant

  handlers:
      - name: Gather service facts
        listen: Restart wpa_supplicant
        ansible.builtin.service_facts:

      # only bounce it if it's actually running, don't start it on systems that
      # don't use it (or use iwd)
      - name: Restart wpa_supplicant if running
        listen: Restart wpa_supplicant
        ansible.builtin.systemd_service:
            name: wpa_supplicant
            state: restarted
        when:
            - "'wpa_supplicant.service' in ansible_facts.services"
            - ansible_facts.services['wpa_supplicant.service'].state == 'running'
