---
- name: Remove OpenSSL Legacy Negotiation Settings
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
      - name: Remove legacy negotiation settings file
        ansible.builtin.file:
            path: /etc/pki/tls/openssl.d/legacy-negotiation.cnf
            state: absent
        notify: Restart wpa_supplicant

  handlers:
      - name: Gather service facts
        listen: Restart wpa_supplicant
        ansible.builtin.service_facts:

      - name: Restart wpa_supplicant if running
        listen: Restart wpa_supplicant
        ansible.builtin.systemd_service:
            name: wpa_supplicant
            state: restarted
        when:
            - "'wpa_supplicant.service' in ansible_facts.services"
            - ansible_facts.services['wpa_supplicant.service'].state == 'running'
