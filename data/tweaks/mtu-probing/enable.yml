---
- name: Enable IPv4 MTU Probing
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
      - name: Enable IPv4 MTU probing
        ansible.posix.sysctl:
            name: net.ipv4.tcp_mtu_probing
            value: "1"
            sysctl_file: /etc/sysctl.d/90-um-mtu-probing.conf
            state: present
            sysctl_set: true
            reload: true
