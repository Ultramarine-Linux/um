---
- name: Disable IPv4 MTU Probing
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
      - name: Remove MTU probing sysctl drop-in
        ansible.builtin.file:
            path: /etc/sysctl.d/90-um-mtu-probing.conf
            state: absent

      # older versions of this tweak wrote straight into /etc/sysctl.conf
      - name: Remove legacy MTU probing entry from /etc/sysctl.conf
        ansible.posix.sysctl:
            name: net.ipv4.tcp_mtu_probing
            state: absent
            reload: false

      # removing the config doesn't touch the live value, reset it to the kernel default
      - name: Reset IPv4 MTU probing to the kernel default
        ansible.builtin.command:
            cmd: sysctl -w net.ipv4.tcp_mtu_probing=0
        changed_when: true
