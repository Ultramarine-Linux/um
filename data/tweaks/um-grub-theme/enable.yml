---
- name: Enable Ultramarine GRUB theme
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
      themes:
          "1": light
          "2": dark
          "3": darker
  tasks:
      - name: Install Ultramarine GRUB theme package
        ansible.builtin.dnf:
            name: ultramarine-grub-theme
            state: present

      - name: Choose a theme
        ansible.builtin.pause:
            prompt: |
                1) Light
                2) Dark
                3) Darker
                Choose a theme (1, 2, or 3)
        register: choice
        until: choice.user_input | trim in themes
        delay: 0

      - name: Install selected theme
        ansible.builtin.dnf:
            name: "ultramarine-grub-theme-{{ themes[choice.user_input | trim] }}"
            state: present
            allowerasing: true

      - name: Use graphical terminal output
        ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: "^#?GRUB_TERMINAL_OUTPUT="
            line: 'GRUB_TERMINAL_OUTPUT="gfxterm"'

      - name: Remove GRUB_THEME override
        ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: "^GRUB_THEME="
            state: absent

      - name: Regenerate GRUB config
        ansible.builtin.command:
            cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
