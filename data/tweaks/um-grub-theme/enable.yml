---
- name: Enable Ultramarine GRUB theme
  hosts: localhost
  connection: local
  become: true
  tasks:
      - name: Set GRUB theme
        ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: "^#?GRUB_THEME="
            line: 'GRUB_THEME="/boot/grub2/themes/ultramarine/theme.txt"'

      - name: Use graphical terminal output
        ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: "^#?GRUB_TERMINAL_OUTPUT="
            line: 'GRUB_TERMINAL_OUTPUT="gfxterm"'

      - name: Regenerate GRUB config
        ansible.builtin.command:
            cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
