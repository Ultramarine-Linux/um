---
- name: Disable Ultramarine GRUB theme
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
      - name: Restore console terminal output
        ansible.builtin.lineinfile:
            path: /etc/default/grub
            regexp: "^#?GRUB_TERMINAL_OUTPUT="
            line: 'GRUB_TERMINAL_OUTPUT="console"'

      - name: Remove Ultramarine GRUB theme packages
        ansible.builtin.dnf:
            name: ultramarine-grub-theme
            state: absent

      - name: Regenerate GRUB config
        ansible.builtin.command:
            cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
