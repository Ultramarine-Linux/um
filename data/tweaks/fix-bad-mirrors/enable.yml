---
- name: Set Terra repository to FyraLabs
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Set Terra repository to FyraLabs
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/terra-fyralabs-all.repo
        mode: "0644"
        notify:
            - Expire DNF metadata cache
            - Refresh DNF metadata
        content: |
          # This file is managed by Ultramarine Tweaks, manual changes will be overwritten.
          [terra]
          name=Terra $releasever
          baseurl=https://repos.fyralabs.com/terra$releasever
          baseurl=https://repos-v4.fyralabs.com/terra$releasever
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever
          repo_gpgcheck=1
          enabled=1
          enabled_metadata=1
          countme=1
          priority=98

          [terra-extras]
          name=Terra $releasever (Extras)
          baseurl=https://repos.fyralabs.com/terra$releasever-extras
          baseurl=https://repos-v4.fyralabs.com/terra$releasever-extras
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-extras
          repo_gpgcheck=1
          enabled=1
          enabled_metadata=1
          countme=1
          priority=149

          [terra-mesa]
          name=Terra $releasever (Mesa)
          baseurl=https://repos.fyralabs.com/terra$releasever-mesa
          baseurl=https://repos-v4.fyralabs.com/terra$releasever-mesa
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-mesa
          repo_gpgcheck=1
          enabled=1
          enabled_metadata=1
          countme=1
          priority=79

          [terra-source]
          name=Terra $releasever - Source
          baseurl=https://repos.fyralabs.com/terra$releasever-source
          baseurl=https://repos-v4.fyralabs.com/terra$releasever-source
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-source
          repo_gpgcheck=1
          enabled=0
          enabled_metadata=0
          priority=98

          [terra-extras-source]
          name=Terra $releasever (Extras) - Source
          baseurl=https://repos.fyralabs.com/terra$releasever-extras-source
          baseurl=https://repos-v4.fyralabs.com/terra$releasever-extras-source
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-extras-source
          repo_gpgcheck=1
          enabled=0
          enabled_metadata=0
          priority=149

          [terra-mesa-source]
          name=Terra $releasever (Mesa) - Source
          baseurl=https://repos.fyralabs.com/terra$releasever-mesa-source
          baseurl=https://repos-v4.fyralabs.com/terra$releasever-mesa-source
          metadata_expire=6h
          type=rpm
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever-mesa-source
          repo_gpgcheck=1
          enabled=0
          enabled_metadata=0
          priority=79

  handlers:
    - name: Expire DNF metadata cache
      ansible.builtin.command:
        cmd: dnf clean expire-cache
    - name: Refresh DNF metadata
      ansible.builtin.dnf:
        update_cache: true
        state: present
